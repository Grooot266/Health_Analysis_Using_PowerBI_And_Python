<html>
    <head>
        <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
        <meta name="viewport" content="width=device-width,intial scale=1.0">	
        <title>Health Analysis</title>
    </head>
    <style type="text/css">
      html{
          font-size: 62.5%;
      }
        body{
            margin: 0rem;		
            padding: 0rem;
        }
    
        .bgimage{
            background-image: url('static\\img\\Home.jpg');
            background-size: 100% 110%;
            width: 100%;
            height: 100vh;
    
        }
    
        .menu{
            width: 100%;
            height: 10rem;		
            background-color: rgba(0, 176, 240, 0.33);
        }
    
        .leftmenu{
            width: 98%;
            line-height: 10rem;		
            float: center;
            
        }
    
        .leftmenu h4{
            padding-left: 7rem;		
            font-weight: bold;
            color: cyan;
            font-size: 3.0rem;		
            font-family: 'Montserrat', sans-serif;	
            text-align: center; 
        }
    
    
        
    
        .txt{
            width: 100%;
            margin-top: 18.5rem;		
            text-transform: uppercase;
            text-align: center;
            color: rgb(255, 255, 255);
    
        }
    
        .txt h4{
            font-size: 2.0rem;		
            font-family: 'Montserrat', sans-serif;
        }
    
        .txt h2{
            font-size: 6rem;		
            font-family: 'Montserrat', sans-serif;		
            font-weight: 70rem;		
            margin: 1.4rem 0rem;		
            color: rgb(255, 255, 255);
    
        }
    
        
    
        #buttonone{
            background-color: transparent;
            border: none;
            font-size: 1.5rem;
            text-transform: uppercase;
            width: 15rem;	
            font-family: 'Montserrat', sans-serif;	
            margin-top: 2.5rem;		
            border: .3rem solid rgb(0, 0, 0);
            color: rgb(0, 0, 0);
    
        }
    
        #buttonone a{
            text-decoration: none;
            color: rgb(0, 0, 0);	
        }
    
        #buttonone :hover{
            color:cyan;
        }
    
       
    
    @media(max-width: 1024px){
        html{
            font-size: 50%;
        }
    
    }
    
    @media(max-width: 768px){
        html{
            font-size: 35%;
        }
    
    }
    
    @media(max-width: 640px){
        html{
            font-size: 30%;
        }
    
    }
    
    @media(max-width: 540px){
        html{
            font-size: 20%;
        }
    
    }
    
    @media(max-width: 425px){
        html{
            font-size: 22%;
        }
    
    }
    
    @media(max-width: 411px){
        html{
            font-size: 20%;
        }
    
    }
    
    
    @media(max-width: 375px){
        html{
            font-size: 15%;
        }
    
    }
    
    
    </style>
    <body>
        <div class="bgimage">
    
            <div class="menu">
    
                <div class="leftmenu">
                    <h4>HEALTH ANALYSIS</h4>
                </div>
                
            </div>
            <div class="txt">
                <h4>Welcome to </h4>
                <h2>HEALTH PREDICTOR</h2>
                <button id="buttonone"><a href="/selectpg">Click here to get your prediction</a></button>
            </div>
        </div>
    
    </body>
    
</html>
